<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100+ Free AI Tools Collection</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

</head>
<body>
    <div class="container">
        <header>
            <h1 class="animate-cyberpunk">100+ Free AI Tools Collection</h1>
            <p class="subtitle animate-float-text">Discover the most powerful AI tools for your creative and professional needs</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for AI tools..." class="animate-shimmer">
        </div>

        <div class="categories">
            <button class="category-btn active" data-category="all">All Tools</button>
            <button class="category-btn" data-category="text">Text Generation</button>
            <button class="category-btn" data-category="image">Image Generation</button>
            <button class="category-btn" data-category="audio">Audio Tools</button>
            <button class="category-btn" data-category="video">Video Tools</button>
            <button class="category-btn" data-category="coding">Coding Tools</button>
            <button class="category-btn" data-category="productivity">Productivity</button>
            <button class="category-btn" data-category="research">Research</button>
            <button class="category-btn" data-category="business">Business</button>
            <button class="category-btn" data-category="media">Media Resources</button>
            <button class="category-btn" data-category="design">Design Tools</button>
            <button class="category-btn" data-category="development">Development</button>
        </div>

        <div class="tools-grid" id="toolsGrid">
            <!-- Tools will be dynamically inserted here -->
        </div>

        <div class="loading">
            <div class="loading-text">More Amazing Tools Coming Soon!</div>
            <div class="loading-subtext">We're constantly adding new AI tools to help you work smarter</div>
            <div class="loading-dots">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        </div>

        <footer class="footer">
            <div class="created-by">Created by</div>
            <div class="creator-name">Security Geek</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
